; Settings for the custom xinput1_3.dll proxy.
; Keep this file next to xinput1_3.dll (in the game folder with the .exe files).

[General]
; 1 = write xinput_proxy.log next to this file (a few lines at startup, overwritten each launch)
Log=1
; 1 = also log a summary every 3 seconds (poll counts, right stick range) for troubleshooting
LogStats=0

[Compatibility]
; 1 = point the game's XInput calls straight at this DLL's own code, so Steam's
; in-game hook (gameoverlayrenderer.dll) can't route the controller around it
RouteAroundHooks=1

[Invert]
; 1 = flip that stick axis before the game sees it
RightY=1
RightX=0
LeftY=0
LeftX=0
