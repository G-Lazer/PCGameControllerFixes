; Settings for the custom dinput8.dll proxy.
; Keep this file next to dinput8.dll (and conviction_game.exe).

[General]
; 1 = write dinput8_proxy.log next to this file (overwritten each launch)
Log=1
; 1 = log every controller button press/release, D-pad and large stick/trigger movement
LogInput=0

[Remap]
; ButtonN=M means: when the game reads button N, give it physical button M.
; Numbers are DirectInput button numbers, starting at 1. Use 0 to disable a button.
; Anything not listed passes through unchanged.
;Button1=2

[Spoof]
; Report controllers to the game with this USB VID:PID (hex). Leave empty for the real one.
; 045E:028E is the wired Xbox 360 controller, the only pad Conviction recognizes.
; Without it, Xbox One/Series pads (045E:02FF) get the game's Logitech button layout.
VidPid=045E:028E
; Optional product name to report as well
ProductName=Controller (XBOX 360 For Windows)

[Devices]
; Comma-separated parts of device names to hide from the game, e.g.
;Hide=Logitech,AMD
Hide=
